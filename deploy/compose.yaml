name: sovereign-ai-control-plane
services:
  control-plane:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:?Set a long random key in .env}
      OPA_URL: http://opa:8181
      MODEL_URL: http://sovereign-model:9000
      ENABLE_EXTERNAL_SIMULATOR: ${ENABLE_EXTERNAL_SIMULATOR:-false}
      EGRESS_GATEWAY_URL: http://egress-gateway:9010
      EXPECTED_POLICY_REVISION: ${EXPECTED_POLICY_REVISION:-redaction-baseline-v3}
      ACTIVE_POLICY_PATH: /policy-active
      POLICY_ARCHIVE_PATH: /policy-archive
      AUDIT_DB_PATH: /var/lib/sovereign/audit.sqlite
      AUDIT_SIGNING_KEY_PATH: /var/lib/sovereign/audit-key.pem
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit-data:/var/lib/sovereign
      - ../policy-active:/policy-active:ro
      - ../policy-archive:/policy-archive:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - opa
      - sovereign-model
    networks:
      - sovereign-internal

  opa:
    image: docker.io/openpolicyagent/opa:1.8.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ../policy-active:/policies:ro
      - ../tests/rego:/policy-tests:ro
    read_only: true
    cap_drop:
      - ALL
    networks:
      - sovereign-internal

  audit-reviewer:
    profiles: ["audit-review"]
    build:
      context: ..
      dockerfile: deploy/ReviewerContainerfile
    volumes:
      - audit-data:/var/lib/sovereign:ro
      - ../policy-archive:/policy-archive:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none

  # Explicit opt-in: podman compose --profile egress-test up -d
  # A separate network makes the external simulator unreachable from the control plane.
  egress-gateway:
    profiles: ["egress-test"]
    build:
      context: ..
      dockerfile: deploy/Containerfile
    command: ["uvicorn", "simulator.egress:app", "--host", "0.0.0.0", "--port", "9010", "--no-access-log", "--no-proxy-headers"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - sovereign-internal
      - simulated-external

  external-simulator:
    profiles: ["egress-test"]
    build:
      context: ..
      dockerfile: deploy/Containerfile
    command: ["uvicorn", "simulator.external:app", "--host", "0.0.0.0", "--port", "9000", "--no-access-log", "--no-proxy-headers"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - simulated-external

  sovereign-model:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    command: ["uvicorn", "simulator.main:app", "--host", "0.0.0.0", "--port", "9000", "--no-access-log", "--no-proxy-headers"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - sovereign-internal

networks:
  sovereign-internal:
    internal: true
  simulated-external:
    internal: true

volumes:
  audit-data:
