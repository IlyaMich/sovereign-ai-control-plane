name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev]'
      # Temporary PR-only review export; removed after committing formatter output.
      - name: Normalize imported reviewer source for PR 44
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 44
        shell: bash
        run: |
          python -m ruff check --fix benchmarks || true
          python -m ruff format benchmarks
          python - <<'PY'
          import json
          from pathlib import Path
          print("BENCH_SOURCE_JSON_START", flush=True)
          for path in sorted(Path("benchmarks").rglob("*.py")):
              if "__pycache__" not in path.parts:
                  print(json.dumps({"path": str(path), "content": path.read_text(encoding="utf-8")}, ensure_ascii=True), flush=True)
          print("BENCH_SOURCE_JSON_END", flush=True)
          PY
      - name: Ruff lint
        run: |
          python -m ruff check .
          python -m ruff check .github/scripts
      - name: Ruff format
        run: |
          # Display the exact correction when a file is not formatted.
          python -m ruff format --diff .github/scripts/sign_release_ci.py || true
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Check CI signer script syntax
        run: python -m py_compile .github/scripts/sign_release_ci.py

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev]'
      - name: Install pinned spaCy model
        run: |
          python -m pip install \
            'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
      - name: Verify model
        run: |
          python -c "import spacy; m=spacy.load('en_core_web_sm'); assert m.meta['version']=='3.8.0'"
      - name: Install patched OPA CLI for signed-runtime integration tests
        run: |
          docker build -f deploy/OPAContainerfile -t sovereign-opa:tests .
          docker create --name test-opa-bin sovereign-opa:tests version
          docker cp test-opa-bin:/opa "$RUNNER_TEMP/opa"
          docker rm test-opa-bin
          chmod +x "$RUNNER_TEMP/opa"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run complete pytest suite
        run: python -m pytest -q -ra -W error
      - name: Run offline benchmark-kit tests
        run: python -m pytest -q -ra -W error benchmarks/tests

  policy:
    name: Policy verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev]'
      - name: Build and verify candidate policy in temporary state
        run: |
          python -m tools.build_policy_snapshot \
            --source policies \
            --archive "$RUNNER_TEMP/proposed-policy-archive" \
            --active "$RUNNER_TEMP/proposed-policy"
          python -m tools.verify_policy_snapshot \
            --archive "$RUNNER_TEMP/proposed-policy-archive" \
            --active "$RUNNER_TEMP/proposed-policy"
      - name: Build pinned patched OPA
        run: docker build -f deploy/OPAContainerfile -t sovereign-opa:ci .
      - name: Check patched OPA dependency version
        run: |
          docker create --name ci-opa-bin sovereign-opa:ci version
          docker cp ci-opa-bin:/opa "$RUNNER_TEMP/opa"
          docker rm ci-opa-bin
          go version -m "$RUNNER_TEMP/opa" | grep -E 'golang.org/x/net[[:space:]]+v0.62.0'
      - name: Test input and output OPA policy
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/proposed-policy:/policies:ro" \
            -v "$PWD/tests/rego:/policy-tests:ro" \
            -v "$PWD/tests/rego_output:/output-policy-tests:ro" \
            --entrypoint /opa \
            sovereign-opa:ci \
            test /policies /policy-tests /output-policy-tests -v

  evaluation:
    name: Evaluation fixture validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m evaluation.cli validate

  code-security:
    name: Code security (High+)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies and Bandit
        run: |
          python -m pip install . 'bandit>=1.8,<2'
          python -m pip freeze > requirements.txt
      - name: SAST — block unreviewed findings
        run: |
          python -m bandit -r app simulator tools .github/scripts --severity-level all
      - name: Dependency, source secret and config security — block High/Critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-filesystem.json
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
      - name: Verify Python dependency scan coverage
        if: always()
        run: python -m tools.verify_dependency_scan trivy-filesystem.json
      - name: Retain filesystem security report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: filesystem-security-report
          path: trivy-filesystem.json
          if-no-files-found: error
