name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: |
          python -m ruff check .
          python -m ruff check .github/scripts
      - name: Ruff format
        run: |
          # Display the exact correction when a file is not formatted.
          python -m ruff format --diff .github/scripts/sign_release_ci.py || true
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Check CI signer script syntax
        run: python -m py_compile .github/scripts/sign_release_ci.py

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Install pinned spaCy model
        run: |
          python -m pip install \
            'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
      - name: Verify model
        run: |
          python -c "import spacy; m=spacy.load('en_core_web_sm'); assert m.meta['version']=='3.8.0'"
      - name: Run complete pytest suite
        run: python -m pytest -q

  policy:
    name: Policy verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Build and verify candidate policy in temporary state
        run: |
          python -m tools.build_policy_snapshot \
            --source policies \
            --archive "$RUNNER_TEMP/proposed-policy-archive" \
            --active "$RUNNER_TEMP/proposed-policy"
          python -m tools.verify_policy_snapshot \
            --archive "$RUNNER_TEMP/proposed-policy-archive" \
            --active "$RUNNER_TEMP/proposed-policy"
      - name: Test input and output OPA policy
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/proposed-policy:/policies:ro" \
            -v "$PWD/tests/rego:/policy-tests:ro" \
            -v "$PWD/tests/rego_output_candidate:/output-policy-tests:ro" \
            --entrypoint /opa \
            openpolicyagent/opa:1.22.4 \
            test /policies /policy-tests /output-policy-tests -v

  evaluation:
    name: Evaluation fixture validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m evaluation.cli validate

  code-security:
    name: Code security (High+)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies and Bandit
        run: |
          python -m pip install . 'bandit>=1.8,<2'
          python -m pip freeze > requirements-ci.txt
      - name: SAST — block High severity
        run: python -m bandit -r app simulator tools .github/scripts -lll
      - name: Dependency, source secret and config security — block High/Critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          format: table
