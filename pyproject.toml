[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-ai-control-plane"
version = "0.6.0"
description = "Local sovereign AI gateway with Presidio classification, OPA, and signed evidence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
  "presidio-analyzer==2.2.366",
  "spacy>=3.8,<3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff==0.17.5",
  "mypy==1.20.2",
]

[tool.setuptools.packages.find]
include = ["app*", "simulator*", "tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["app", "simulator", "tools", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

# Presidio does not ship type information. Keep missing-import checks elsewhere.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true
